version: "3.9"

services:
  # ------------------------------------------------------------------ #
  # PostgreSQL + PostGIS
  # ------------------------------------------------------------------ #
  db:
    image: postgis/postgis:16-3.4
    container_name: terrasentinel_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-terrasentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-terrasentinel_dev}
      POSTGRES_DB: ${POSTGRES_DB:-terrasentinel}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-terrasentinel} -d ${POSTGRES_DB:-terrasentinel}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ------------------------------------------------------------------ #
  # FastAPI application
  # ------------------------------------------------------------------ #
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: terrasentinel_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
    driver: local
