name: terrasentinel_mobile
description: "TerraSentinel Mobile — AI-powered Landslide Early Warning, High-Alert Siren, Multi-Agency Disaster Dispatch & Offline Field Intelligence for Northeast India (NER)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Networking & HTTP
  dio: ^5.4.0
  connectivity_plus: ^5.0.2

  # Geospatial & Offline Mapping
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Local Offline Database
  sqflite: ^2.3.0
  path_provider: ^2.1.2
  path: ^1.9.0
  shared_preferences: ^2.2.2

  # Emergency High-Alert Audio & Notifications
  flutter_local_notifications: ^17.0.0
  audioplayers: ^6.0.0
  vibration: ^2.0.0

  # Device Hardware & Sensors
  geolocator: ^11.0.0
  image_picker: ^1.0.7
  url_launcher: ^6.2.4

  # Data Visualization & Charts (SHAP waterfall & risk telemetry)
  fl_chart: ^0.66.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  flutter_staggered_animations: ^1.1.1
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/sounds/
